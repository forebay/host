name: Test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    uses: intisy/workflows/.github/workflows/test.yml@main
    with:
      toolchains: node cmake
      runners: '["ubuntu-latest","windows-latest","macos-latest"]'
      extra_repositories: |
        weivel/model siblings/model 606988fb178b04d3f53835e6d982c09f31081ef1
        weivel/typescript siblings/typescript 46bf872abbfcfe164294a9b3daa40fa0c26fff77
        spisor/library siblings/library 0eda95f26862fac2b5779b5e52b837a4da6e0897
        forebay/library siblings/forebay-library 692a613a493ec43aaa1099a28eee74ffe0e3e567
      node_install: npm ci --prefix siblings/model && npm ci --prefix siblings/typescript && npm ci
      node_build: cmake -S siblings/library -B siblings/library/build && cmake --build siblings/library/build --config Release && cmake -S siblings/forebay-library -B siblings/forebay-library/build && cmake --build siblings/forebay-library/build --config Release --target apps && npm run build --prefix siblings/typescript && npm run build
      node_test: npm test
      cmake_configure: '-S siblings/library -B siblings/library/build'
      cmake_build: '--build siblings/library/build --config Release'
      cmake_test: ''
